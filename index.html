<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт-визитка</title>
    <!-- Подключаем красивый шрифт Roboto из Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Подключаем файл стилей CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <!-- Аватар/Фото профиля -->
        <div class="avatar-container">
            <img src="https://unsplash.com" alt="Фото профиля" class="avatar">
        </div>

        <!-- Основная информация -->
        <h1 class="name">Алексей Иванов</h1>
        <p class="profession">Frontend Разработчик & Дизайнер</p>
        
        <p class="bio">
            Создаю современные, быстрые и удобные веб-сайты. Помогаю бизнесу и экспертам заявить о себе в интернете с помощью лаконичного дизайна и чистого кода.
        </p>

        <!-- Ссылки на контакты и соцсети -->
        <div class="links-container">
            <a href="https://t.me" target="_blank" class="link-btn telegram">Telegram</a>
            <a href="https://github.com/" target="_blank" class="link-btn github">GitHub</a>
            <a href="mailto:example@email.com" class="link-btn email">Email</a>
        </div>
    </div>

</body>
</html>
