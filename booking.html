<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenWood | Бронирование</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="booking-page">

    <header class="header">
        <div class="logo">🌲 Green<span>Wood</span></div>
        <nav>
            <ul class="nav-menu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="rooms.html">Наши Дома</a></li>
                <li><a href="gallery.html">Галерея</a></li>
                <li><a href="booking.html" class="active">Бронирование</a></li>
            </ul>
        </nav>
    </header>

    <main class="booking-hero">
        <div class="booking-card">
            <h2>Забронировать отдых</h2>
            <p class="subtitle">Заполните форму, и мы подготовим ваш идеальный эко-дом</p>

            <form id="bookingForm" class="booking-form">
                <div class="form-group">
                    <label for="room-select">Выберите домик</label>
                    <select id="room-select" required>
                        <option value="" disabled selected>-- Выберите вариант --</option>
                        <option value="nest">Гнездо (для двоих)</option>
                        <option value="panorama">Панорама (семейный)</option>
                        <option value="observatory">Обсерватория (с прозрачной крышей)</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="check-in">Дата заезда</label>
                        <input type="date" id="check-in" required>
                    </div>
                    <div class="form-group">
                        <label for="check-out">Дата выезда</label>
                        <input type="date" id="check-out" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="guests">Гости</label>
                        <input type="number" id="guests" min="1" max="6" value="2" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Подтвердить бронирование</button>
            </form>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
